# Pone orden en las Releases: la version que hay en VERSION de la rama main es la estable (Latest);
# todas las demas quedan como Pre-release. Se lanza a mano (Actions > "Ordenar releases" > Run workflow)
# o sola cuando cambia este archivo.
name: Ordenar releases

on:
  workflow_dispatch:
  push:
    branches: [main, manos]
    paths: [.github/workflows/ordenar-releases.yml]

permissions:
  contents: write

jobs:
  ordenar:
    runs-on: ubuntu-latest
    steps:
      - name: Marcar estable / pruebas
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ESTABLE="$(gh api "repos/$REPO/contents/VERSION?ref=main" -q .content | base64 -d | tr -d ' \r\n')"
          echo "Estable (main): $ESTABLE"
          gh api "repos/$REPO/releases" --paginate -q '.[] | "\(.id) \(.tag_name) \(.prerelease)"' |
          while read id tag pre; do
            if [ "$tag" = "$ESTABLE" ]; then
              gh api -X PATCH "repos/$REPO/releases/$id" -F prerelease=false -f make_latest=true -q '"\(.tag_name): ESTABLE (Latest)"'
            elif [ "$pre" = "false" ]; then
              gh api -X PATCH "repos/$REPO/releases/$id" -F prerelease=true -f make_latest=false -q '"\(.tag_name): pre-release"'
            fi
          done
          echo "Latest ahora: $(gh api "repos/$REPO/releases/latest" -q .tag_name)"
