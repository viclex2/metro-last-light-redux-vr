# Pone orden en las Releases (13/11, decidido con Alex): SOLO una version es publica (la de PUBLICA, con el
# nombre NOMBRE y marcada como Latest). Todas las demas pasan a BORRADOR (draft): solo las ve el dueno del repo.
# Se lanza a mano (Actions > "Ordenar releases" > Run workflow) o sola cuando cambia este archivo.
name: Ordenar releases

on:
  workflow_dispatch:
  push:
    branches: [main, manos]
    paths: [.github/workflows/ordenar-releases.yml, 'docs/RELEASE_*.md']

permissions:
  contents: write

env:
  PUBLICA: E35
  NOMBRE: V-0.1-E35
  NOTAS: docs/RELEASE_V-0.1-E35.md   # descripcion de la publica (si el archivo existe)

jobs:
  ordenar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Una publica, las demas en borrador
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/releases" --paginate -q '.[] | "\(.id) \(.tag_name) \(.draft)"' |
          while read id tag draft; do
            if [ "$tag" = "$PUBLICA" ]; then
              gh api -X PATCH "repos/$REPO/releases/$id" -F draft=false -F prerelease=false -f make_latest=true -f name="$NOMBRE" -q '"\(.tag_name): PUBLICA (\(.name), Latest)"'
              if [ -f "$NOTAS" ]; then gh api -X PATCH "repos/$REPO/releases/$id" -f body="$(cat "$NOTAS")" -q '"\(.tag_name): descripcion puesta"'; fi
            elif [ "$draft" = "false" ]; then
              gh api -X PATCH "repos/$REPO/releases/$id" -F draft=true -q '"\(.tag_name): borrador (privada)"'
            fi
          done
          echo "Latest ahora: $(gh api "repos/$REPO/releases/latest" -q '.tag_name + " = " + .name')"
