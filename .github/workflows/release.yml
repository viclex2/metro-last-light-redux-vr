# Rama main = version normal; rama manos = version de pruebas (sale como pre-release).
# Cuando cambia el archivo VERSION (por ejemplo, de E5 a E6), GitHub compila la DLL
# desde el codigo y crea la Release con esa etiqueta, la DLL adjunta y las notas del CHANGELOG.
name: Release

on:
  push:
    branches: [main, manos]
    paths: [VERSION, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar el compilador (mingw-w64)
        timeout-minutes: 8
        run: sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 gcc-mingw-w64-x86-64

      - name: Compilar d3d11.dll
        run: sh build.sh && ls -la d3d11.dll

      - name: Sacar las notas de esta version del CHANGELOG
        run: |
          TAG="$(tr -d ' \r\n' < VERSION)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # el bloque que empieza por "## TAG " hasta el siguiente "## "
          awk -v t="$TAG" '
            /^## / { if (p) exit; if ($2 == t) p = 1 }
            p { print }
          ' CHANGELOG.md > notas.md
          [ -s notas.md ] || echo "Version $TAG. Ver CHANGELOG.md y docs/ESTADO.md." > notas.md
          # Titulo de la Release: "E33 — Solo las manos..." (+ "(pruebas)" si no es main)
          TITULO="$(head -n1 notas.md | grep '^## ' | sed -e 's/^## *//' -e 's/ *(rama `[^`]*`) */ /')"
          [ -n "$TITULO" ] || TITULO="$TAG"
          if [ "${{ github.ref_name }}" != "main" ]; then TITULO="$TITULO (pruebas)"; fi
          echo "TITULO=$TITULO" >> "$GITHUB_ENV"
          printf '\n---\n**Instalar:** `d3d11.dll` + `openvr_api.dll` (64 bits, de Valve) junto a `metro.exe`. Ver README.\n' >> notas.md
          cat notas.md

      - name: Crear la Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TITULO }}
          target_commitish: ${{ github.sha }}
          body_path: notas.md
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: ${{ github.ref_name == 'main' && 'true' || 'false' }}
          files: d3d11.dll

      # Deja en bin/ la MISMA DLL que va en la Release (asi el enlace raw/<rama>/bin/d3d11.dll nunca se queda viejo)
      - name: Guardar la DLL compilada en bin/
        run: |
          cp d3d11.dll bin/d3d11.dll
          if git diff --quiet -- bin/d3d11.dll; then echo "bin/ ya estaba al dia"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin/d3d11.dll
          git commit -m "bin: d3d11.dll de la $TAG (compilada por GitHub)"
          git push origin HEAD:${{ github.ref_name }}
